  <style>
    /* Default page geometry. With no @page anywhere Paged.js falls back to
       letter/margin-0, so a sensible default must always be present — but it is
       just a default: this is unlayered and loads before author sheets, so an
       author @page { size: A5 } in a linked stylesheet beats it on source order
       (verified against the real engine). It lives here, not in the addendum,
       because Paged.js hoists @page out of any @layer — the addendum's whole
       contract is "always loses via layering", which a hoisted rule can't keep.
       Presentation beyond this default (size, margins, running headers/footers
       via the @top- and @bottom- margin boxes) is author CSS now, not config.

       DO NOT write a star followed by a slash inside this comment. It
       happened: naming the two margin-box families with a star wildcard and a
       slash between them closed the comment four lines early, the remainder
       parsed as garbage, and Chromium's error recovery swallowed the @page
       rule below. The "default that must always be present" reached no browser
       at all, and every document without its own @page silently got Paged.js's
       letter/margin-0 fallback instead of A4/20mm. Nothing noticed for months,
       because Paged.js HAS a fallback: the symptom was a slightly wrong page
       size, never an error. Cicero found it in an hour by refusing to guess a
       page size at all (its I5), which is the argument for a second engine in
       one bug. Note also that this CSS lives in a JS template literal, so a
       backtick here is a syntax error in this file. */
    @page { size: A4; margin: 20mm; }

    @media print { .no-print { display: none !important; } }
    .page-break { break-after: page; }
    .no-break { break-inside: avoid; }

    /* Figure numbering + cross-references (functional, resolved by the paged
       engine at layout time — target-counter() is standard CSS GCPM). The
       "Figure N." label is a look and lives in the addendum. */
    body { counter-reset: figure; }
    figure { counter-increment: figure; }
    .xref::after { content: target-counter(attr(href url), figure); }

    /* Generated table-of-contents page. The page break and the page number are
       the feature — target-counter() is resolved by the paged engine at layout
       time and nothing else can produce it. The leader layout and the
       per-level indents are a look, and live in the addendum. */
    .toc-page { break-after: page; }
    /* attr(href url) — the typed form, as in the xref rule above. The spec's
       first parameter is a url; Paged.js reads extra idents as fallback
       attribute names, so typed and untyped behave identically there, but an
       engine that honours attr() types needs the annotation. Keep them typed. */
    .toc-entry a::after { content: target-counter(attr(href url), page); }

  </style>
