<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A CFF2 variable face at a weight other than its default</title>
  <link rel="stylesheet" href="roads.css">
  <style>
    @font-face { font-family: 'Source Serif 4 Variable'; src: url(fonts/SourceSerif4Variable-Roman_subset.otf) format('opentype'); font-weight: 200 900; font-style: normal; }
    .cff2 { font-family: 'Source Serif 4 Variable'; font-weight: 700; font-size: 24pt; }
  </style>
</head>
<body>
  <h1>A CFF2 variable face</h1>
  <p>The face is HarfBuzz's subset of Source Serif 4 Variable, which maps one character, U+045D, set below at weight 700.</p>
  <p class="cff2" lang="bg">ѝ ѝ ѝ</p>
</body>
</html>
