<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The downsampling road: a JPEG and a PNG far above 450 ppi, one PNG placed twice</title>
  <link rel="stylesheet" href="roads.css">
  <style>
    figure { margin: 0 0 3mm; break-inside: avoid; }
    figcaption { font-size: 8pt; }
  </style>
</head>
<body>
  <h1>Downsampling</h1>
  <figure><img src="large.jpg" alt="A synthetic photograph, 4000 by 3000 pixels, in a box three inches wide" style="width: 76.2mm"><figcaption>large.jpg, 4000 by 3000, three inches wide.</figcaption></figure>
  <figure><img src="large.png" alt="A synthetic photograph, 2400 by 1600 pixels, in a box 40 mm wide" style="width: 40mm"><figcaption>large.png, 2400 by 1600, 40 mm wide.</figcaption></figure>
  <figure><img src="large.png" alt="The same photograph, 2400 by 1600 pixels, in a box 80 mm wide" style="width: 80mm"><figcaption>The same file, 80 mm wide.</figcaption></figure>
</body>
</html>
