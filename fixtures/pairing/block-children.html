<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inline elements made display: block inside a div</title>
<style>
@font-face { font-family: 'Source Serif 4'; src: url('/_beltype/vendor/beltype-fonts/sourceserif4/SourceSerif4-Variable.woff2') format('woff2-variations'); font-weight: 200 900; font-style: normal; }
@font-face { font-family: 'Source Serif 4'; src: url('/_beltype/vendor/beltype-fonts/sourceserif4/SourceSerif4-Italic-Variable.woff2') format('woff2-variations'); font-weight: 200 900; font-style: italic; }
@page { size: 105mm 148mm; margin: 10mm; }
body { font: 9pt/12pt 'Source Serif 4', serif; }
.s { display: grid; grid-template-columns: 1fr 1fr; }
.s b, .s span { display: block; }
</style>
</head>
<body>
<div class="s"><div><b>24</b><span>Titles published</span></div><div><b>61 200</b><span>Copies printed</span></div></div>
</body>
</html>
